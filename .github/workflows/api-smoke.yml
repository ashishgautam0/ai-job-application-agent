name: API smoke tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Python the deployed function runs, so a break that only
          # appears on one version cannot hide here.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # requirements.txt is what the deployed function installs. Installing it
      # unmodified is the point of this lane: it runs the resolution that ships.
      - run: pip install -r requirements.txt
      # httpx backs fastapi's TestClient. supabase pulls it in anyway; naming
      # it keeps the lane from resting on a transitive dependency.
      - run: pip install httpx
      - name: Report the resolved dependencies
        run: pip freeze
      - env:
          # The fake client is injected before the app starts; no credential is
          # read, and the lane must never reach the real database.
          SUPABASE_URL: ''
          SUPABASE_KEY: ''
        run: python -m unittest discover -s backend/tests -p test_api_smoke.py -v
      - run: python -m compileall -q backend
